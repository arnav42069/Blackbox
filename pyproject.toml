[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-local"
version = "0.1.0"
description = "Scoped, local-first Ollama lab assistant"
requires-python = ">=3.12"
dependencies = ["fastapi==0.121.3", "uvicorn==0.38.0", "httpx==0.28.1", "pydantic==2.12.4", "python-multipart==0.0.20", "Pillow==12.0.0", "PyYAML==6.0.3", "asyncssh==2.21.1"]

[project.optional-dependencies]
test = ["pytest==9.0.1", "pytest-asyncio==1.3.0"]

[project.scripts]
blackbox = "blackbox.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration", "tests/qa"]
pythonpath = ["backend", "."]
